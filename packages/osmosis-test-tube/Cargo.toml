[package]
description = "CosmWasm integration testing for Osmosis"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "osmosis-test-tube"
repository = "https://github.com/osmosis-labs/test-tube"
version = "25.0.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

exclude = ["osmosis", "test_artifacts"]

[features]
default = []
wasm-sudo = ["test-tube/wasm-sudo"]

[dependencies]
base64 = "0.21.5"
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", rev = "2a070ec1111a14a9e479e49b52c21bbf0093b117" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", rev = "cb7b4bc4892a8ad74eaaeeba56e634e119608d30" }
prost = { version = "0.14.1", default-features = false }
serde = "1.0.144"
serde_json = "1.0.85"
test-tube = { path = "../test-tube", features = ["module-wrappers"] }
thiserror = "1.0.34"

[build-dependencies]
bindgen = "0.69.1"

[dev-dependencies]
cw1-whitelist = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f7ef1aaafd368d811f268cf47360a7d808e74102" }
rayon = "1.5.3"
simple-sudo = { path = "../../test_contracts/simple-sudo" }
